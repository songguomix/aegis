{
  "appId": "com.aegis.gateway",
  "productName": "Aegis",
  "copyright": "Copyright © 2026 Aegis",
  "directories": {
    "output": "release",
    "buildResources": "build"
  },
  "files": [
    "electron/**/*",
    "dist/**/*",
    "dist-server/**/*",
    "package.json"
  ],
  "asarUnpack": [
    "dist-server/data/**/*",
    "dist-server/**/*.js",
    "dist/**/*"
  ],
  "extraMetadata": {
    "main": "electron/main.cjs"
  },
  "mac": {
    "category": "public.app-category.utilities",
    "target": [
      {
        "target": "dmg",
        "arch": ["arm64"]
      },
      {
        "target": "zip",
        "arch": ["arm64"]
      }
    ],
    "identity": null,
    "hardenedRuntime": false,
    "gatekeeperAssess": false
  },
  "dmg": {
    "title": "Aegis",
    "backgroundColor": "#ffffff",
    "window": {
      "width": 540,
      "height": 380
    }
  },
  "win": {
    "target": [
      {
        "target": "nsis",
        "arch": ["x64"]
      }
    ]
  },
  "nsis": {
    "oneClick": true,
    "perMachine": false
  },
  "linux": {
    "category": "Utility",
    "target": [
      {
        "target": "AppImage",
        "arch": ["x64"]
      },
      {
        "target": "deb",
        "arch": ["x64"]
      }
    ]
  }
}
