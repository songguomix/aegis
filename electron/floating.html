<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Aegis Float</title>
    <style>
      :root {
        --text: #171717;
        --muted: #737373;
        --ok: #059669;
        --bad: #be123c;
        --warn: #a16207;
        --spring: cubic-bezier(0.22, 1.15, 0.36, 1);
        --soft: cubic-bezier(0.4, 0, 0.2, 1);
        --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
          "PingFang SC", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
      }
      body {
        background: transparent;
        overflow: hidden;
        user-select: none;
      }
      body.preview {
        background:
          radial-gradient(800px 400px at 50% 0%, rgba(99, 102, 241, 0.12), transparent 60%),
          #f3f4f6;
        min-height: 100vh;
        display: grid;
        place-items: start center;
        padding-top: 28px;
      }

      .bar {
        -webkit-app-region: drag;
        width: 100%;
        height: 100%;
        min-height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 8px 8px 8px 12px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.95),
          0 10px 32px rgba(15, 23, 42, 0.14);
        backdrop-filter: blur(28px) saturate(170%);
        -webkit-backdrop-filter: blur(28px) saturate(170%);
        transition: box-shadow 0.4s var(--soft);
      }
      .bar.has-domain,
      .bar.has-review {
        justify-content: flex-start;
      }
      .bar.lift {
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.98),
          0 14px 40px rgba(15, 23, 42, 0.18);
      }

      body.preview .bar {
        width: min(480px, 94vw);
        height: 56px;
        transition: width 0.4s var(--spring), box-shadow 0.4s var(--soft);
      }
      body.preview .bar:not(.has-domain):not(.has-review) {
        width: min(240px, 88vw);
        margin: 0 auto;
      }

      .light {
        position: relative;
        flex-shrink: 0;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #a3a3a3;
        box-shadow: 0 0 0 3px rgba(163, 163, 163, 0.16);
        transition:
          background 0.3s var(--soft),
          box-shadow 0.35s var(--soft),
          transform 0.35s var(--spring);
      }
      .light.allow {
        background: var(--ok);
        box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.18);
      }
      .light.review {
        background: #d97706;
        box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.18);
      }
      .light.block {
        background: var(--bad);
        box-shadow: 0 0 0 3px rgba(190, 18, 60, 0.18);
      }
      .light::after {
        content: "";
        position: absolute;
        inset: -3px;
        border-radius: 50%;
        border: 1.5px solid transparent;
        opacity: 0;
      }
      .light.allow::after {
        border-color: rgba(5, 150, 105, 0.45);
      }
      .light.review::after {
        border-color: rgba(217, 119, 6, 0.45);
      }
      .light.block::after {
        border-color: rgba(190, 18, 60, 0.45);
      }
      .light.pulse {
        animation: lightPulse 0.7s var(--spring);
      }
      .light.pulse::after {
        animation: ringOut 0.7s var(--soft);
      }
      @keyframes lightPulse {
        0% {
          transform: scale(0.75);
        }
        40% {
          transform: scale(1.25);
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes ringOut {
        0% {
          opacity: 0.9;
          transform: scale(0.7);
        }
        100% {
          opacity: 0;
          transform: scale(2);
        }
      }

      .counts {
        -webkit-app-region: no-drag;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 3px;
        border-radius: 12px;
        background: rgba(17, 24, 39, 0.04);
        cursor: pointer;
      }
      .count {
        min-width: 36px;
        padding: 2px 6px;
        border-radius: 8px;
        text-align: center;
        transition: background 0.2s var(--soft);
      }
      .count:hover {
        background: rgba(255, 255, 255, 0.9);
      }
      .count .n {
        display: block;
        font-size: 12.5px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.15;
        font-variant-numeric: tabular-nums;
      }
      .count .l {
        display: block;
        font-size: 8px;
        font-weight: 650;
        color: var(--muted);
        line-height: 1;
        margin-top: 0;
        text-transform: uppercase;
      }
      .count.allow .n {
        color: var(--ok);
      }
      .count.review .n {
        color: var(--warn);
      }
      .count.block .n {
        color: var(--bad);
      }
      .count.bump .n {
        animation: numBump 0.4s var(--spring);
      }
      @keyframes numBump {
        0% {
          transform: scale(0.9);
          opacity: 0.7;
        }
        60% {
          transform: scale(1.08);
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      /* expandable middle */
      .slot {
        -webkit-app-region: no-drag;
        flex: 0 0 0%;
        min-width: 0;
        max-width: 0;
        opacity: 0;
        overflow: hidden;
        border-radius: 12px;
        background: rgba(17, 24, 39, 0.04);
        height: 36px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0;
        transform: translateX(12px) scaleX(0.94);
        transform-origin: left center;
        transition:
          flex 0.4s var(--spring),
          max-width 0.4s var(--spring),
          opacity 0.25s var(--soft),
          padding 0.3s var(--soft),
          transform 0.4s var(--spring);
      }
      .bar.has-domain .slot,
      .bar.has-review .slot {
        flex: 1 1 auto;
        max-width: none;
        opacity: 1;
        padding: 0 8px 0 12px;
        transform: translateX(0) scaleX(1);
      }

      .tag {
        flex-shrink: 0;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 2px 6px;
        border-radius: 5px;
      }
      .tag.allow {
        color: var(--ok);
        background: rgba(5, 150, 105, 0.12);
      }
      .tag.review {
        color: var(--warn);
        background: rgba(217, 119, 6, 0.12);
      }
      .tag.block {
        color: var(--bad);
        background: rgba(190, 18, 60, 0.12);
      }

      .host {
        min-width: 0;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text);
        cursor: pointer;
      }

      .acts {
        display: none;
        align-items: center;
        gap: 4px;
        flex-shrink: 0;
      }
      .bar.has-review .acts {
        display: flex;
      }
      .bar.has-review .host {
        cursor: default;
      }

      .act {
        -webkit-app-region: no-drag;
        appearance: none;
        border: 1px solid transparent;
        height: 24px;
        padding: 0 8px;
        border-radius: 7px;
        font-size: 11px;
        font-weight: 650;
        cursor: pointer;
        white-space: nowrap;
        transition:
          background 0.2s var(--soft),
          transform 0.3s var(--spring),
          opacity 0.2s ease;
      }
      .act:hover {
        transform: translateY(-1px);
      }
      .act:active {
        transform: translateY(0) scale(0.97);
      }
      .act.ok {
        background: rgba(5, 150, 105, 0.12);
        color: var(--ok);
        border-color: rgba(5, 150, 105, 0.2);
      }
      .act.ok:hover {
        background: rgba(5, 150, 105, 0.2);
      }
      .act.no {
        background: rgba(190, 18, 60, 0.1);
        color: var(--bad);
        border-color: rgba(190, 18, 60, 0.18);
      }
      .act.no:hover {
        background: rgba(190, 18, 60, 0.18);
      }
      .act.ghost {
        background: rgba(17, 24, 39, 0.04);
        color: var(--muted);
        border-color: rgba(17, 24, 39, 0.08);
      }
      .act:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none;
      }

      .open {
        -webkit-app-region: no-drag;
        flex-shrink: 0;
        margin-left: auto;
        appearance: none;
        border: 1px solid rgba(17, 24, 39, 0.08);
        width: 28px;
        height: 28px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.72);
        color: #404040;
        cursor: pointer;
        display: grid;
        place-items: center;
        padding: 0;
        transition:
          background 0.2s var(--soft),
          transform 0.3s var(--spring);
      }
      .bar:not(.has-domain):not(.has-review) .open {
        margin-left: 0;
      }
      .open:hover {
        background: #fff;
        transform: translateY(-1px) scale(1.04);
      }
      .open svg {
        display: block;
        transition: transform 0.25s var(--spring);
      }
      .open:hover svg {
        transform: translate(1px, -1px);
      }

      .bar.flash-allow,
      .bar.flash-review,
      .bar.flash-block {
        animation: glow 0.65s var(--soft);
      }
      @keyframes glow {
        0%,
        100% {
          box-shadow:
            inset 0 0 0 2px rgba(5, 150, 105, 0),
            0 10px 32px rgba(15, 23, 42, 0.14);
        }
        30% {
          box-shadow:
            inset 0 0 0 2px rgba(5, 150, 105, 0.4),
            0 14px 36px rgba(15, 23, 42, 0.16);
        }
      }
      .bar.flash-review {
        animation-name: glowWarn;
      }
      .bar.flash-block {
        animation-name: glowBad;
      }
      @keyframes glowWarn {
        0%,
        100% {
          box-shadow:
            inset 0 0 0 2px rgba(217, 119, 6, 0),
            0 10px 32px rgba(15, 23, 42, 0.14);
        }
        30% {
          box-shadow:
            inset 0 0 0 2px rgba(217, 119, 6, 0.45),
            0 14px 36px rgba(15, 23, 42, 0.16);
        }
      }
      @keyframes glowBad {
        0%,
        100% {
          box-shadow:
            inset 0 0 0 2px rgba(190, 18, 60, 0),
            0 10px 32px rgba(15, 23, 42, 0.14);
        }
        30% {
          box-shadow:
            inset 0 0 0 2px rgba(190, 18, 60, 0.45),
            0 14px 36px rgba(15, 23, 42, 0.16);
        }
      }
    </style>
  </head>
  <body>
    <div class="bar" id="bar">
      <div class="light" id="light"></div>
      <div class="counts" id="counts">
        <div class="count allow" data-k="allow">
          <span class="n" id="n-allow">0</span>
          <span class="l">OK</span>
        </div>
        <div class="count review" data-k="review">
          <span class="n" id="n-review">0</span>
          <span class="l">?</span>
        </div>
        <div class="count block" data-k="block">
          <span class="n" id="n-block">0</span>
          <span class="l">NO</span>
        </div>
      </div>
      <div class="slot" id="slot">
        <span class="tag" id="tag"></span>
        <span class="host" id="host" title="Open Aegis"></span>
        <div class="acts" id="acts">
          <button class="act ok" id="btn-allow" type="button">放行</button>
          <button class="act no" id="btn-block" type="button">拦截</button>
        </div>
      </div>
      <button class="open" id="btn-open" title="Open Aegis" aria-label="Open">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path
            d="M4 10L10 4M10 4H5.5M10 4V8.5"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </div>

    <script src="./sound.js"></script>
    <script>
      if (new URLSearchParams(location.search).get("preview") === "1") {
        document.body.classList.add("preview");
      }
      (function () {
        const LIVE_MS = 5000;
        const REVIEW_MS = 30000; // wait longer when human/AI choice is needed
        const params = new URLSearchParams(location.search);
        const port = params.get("port") || "7832";
        const base = `http://127.0.0.1:${port}/api/v1`;

        const bar = document.getElementById("bar");
        const light = document.getElementById("light");
        const tag = document.getElementById("tag");
        const host = document.getElementById("host");
        const btnAllow = document.getElementById("btn-allow");
        const btnBlock = document.getElementById("btn-block");

        let lastId = null;
        let hideTimer = null;
        let queue = [];
        let live = false;
        let activeReviewId = null;
        const lastCounts = { allow: null, review: null, block: null };

        function apiBridge() {
          return window.aegisFloating || null;
        }

        function setCompact(compact) {
          try {
            apiBridge()?.setCompact?.(compact);
          } catch {
            /* preview */
          }
        }

        function setLight(decision) {
          light.classList.remove("pulse");
          light.className = "light " + (decision || "");
          void light.offsetWidth;
          light.classList.add("pulse");
        }

        function flash(decision) {
          const cls = "flash-" + (decision || "allow");
          bar.classList.remove("flash-allow", "flash-review", "flash-block", "lift");
          void bar.offsetWidth;
          bar.classList.add(cls, "lift");
          setTimeout(() => bar.classList.remove(cls, "lift"), 700);
        }

        function bumpCount(key, value) {
          const el = document.querySelector('.count[data-k="' + key + '"] .n');
          const wrap = document.querySelector('.count[data-k="' + key + '"]');
          if (!el) return;
          const changed = lastCounts[key] !== value;
          lastCounts[key] = value;
          el.textContent = String(value);
          if (!changed) return;
          wrap.classList.remove("bump");
          void wrap.offsetWidth;
          wrap.classList.add("bump");
        }

        function hideSlot() {
          live = false;
          activeReviewId = null;
          bar.classList.remove("has-domain", "has-review");
          setCompact(true);
          // lock current position after animation — no jump
          try {
            apiBridge()?.lockAnchor?.();
          } catch {
            /* preview */
          }
        }

        function showItem(item) {
          live = true;
          const decision = item.decision;
          const hostname = item.hostname || item.url;
          activeReviewId = decision === "review" ? item.reviewId || item.id || null : null;

          setLight(decision);
          tag.className = "tag " + decision;
          tag.textContent = decision;
          host.textContent = hostname || "";
          try {
            window.AegisSound?.play(decision);
          } catch {
            /* ignore */
          }

          bar.classList.remove("has-domain", "has-review");
          void bar.getBoundingClientRect();
          requestAnimationFrame(() => {
            if (decision === "review" && item.needsReview) {
              bar.classList.add("has-review");
            } else {
              bar.classList.add("has-domain");
            }
            setCompact(false);
            try {
              apiBridge()?.lockAnchor?.();
            } catch {
              /* preview */
            }
          });
          flash(decision);

          clearTimeout(hideTimer);
          const ms = item.needsReview ? REVIEW_MS : LIVE_MS;
          hideTimer = setTimeout(() => {
            hideSlot();
            const next = queue.shift();
            if (next) setTimeout(() => showItem(next), 260);
          }, ms);
        }

        function pushItem(payload) {
          if (live) {
            queue = queue.filter((q) => q.hostname !== payload.hostname);
            queue.unshift(payload);
            if (queue.length > 4) queue.length = 4;
            if (payload.decision) setLight(payload.decision);
            return;
          }
          showItem(payload);
        }

        async function resolve(decision) {
          const id = activeReviewId;
          if (!id) return;
          btnAllow.disabled = true;
          btnBlock.disabled = true;
          try {
            const port2 = port;
            await fetch(`http://127.0.0.1:${port2}/api/v1/reviews/${id}/resolve`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                decision,
                by: "user",
                alwaysAllow: decision === "allow",
              }),
            });
            // brief confirmation state, then collapse — same window anchor
            tag.className = "tag " + decision;
            tag.textContent = decision;
            setLight(decision);
            try {
              window.AegisSound?.play(decision);
            } catch {
              /* ignore */
            }
            flash(decision);
            setTimeout(() => {
              hideSlot();
              const next = queue.shift();
              if (next) setTimeout(() => showItem(next), 260);
            }, 900);
          } catch {
            btnAllow.disabled = false;
            btnBlock.disabled = false;
          }
        }

        btnAllow.addEventListener("click", (e) => {
          e.stopPropagation();
          resolve("allow");
        });
        btnBlock.addEventListener("click", (e) => {
          e.stopPropagation();
          resolve("block");
        });

        // Sound is controlled in the main app Settings (not on the float)
        function syncSoundFromServer(on) {
          if (window.AegisSound && typeof on === "boolean") {
            window.AegisSound.setEnabled(on);
          }
        }

        async function refresh() {
          try {
            const [healthRes, histRes, revRes] = await Promise.all([
              fetch(base + "/health"),
              fetch(base + "/history?limit=5"),
              fetch(base + "/reviews"),
            ]);
            const health = await healthRes.json();
            const hist = await histRes.json();
            const rev = await revRes.json();

            bumpCount("allow", health?.stats?.allow ?? 0);
            bumpCount(
              "review",
              rev?.stats?.pending ?? health?.reviews?.pending ?? health?.stats?.review ?? 0,
            );
            bumpCount("block", health?.stats?.block ?? 0);
            syncSoundFromServer(health?.soundEnabled !== false);

            // Pending reviews take priority on the float (human or AI can act)
            const pending = rev?.items ?? [];
            const p = pending[0];
            if (p && p.id !== activeReviewId) {
              const already =
                live && host.textContent === (p.hostname || p.url) && bar.classList.contains("has-review");
              if (!already) {
                pushItem({
                  decision: "review",
                  needsReview: true,
                  hostname: p.hostname || p.url,
                  reviewId: p.id,
                  id: p.id,
                });
              }
              return;
            }

            const items = hist?.items ?? [];
            const newest = items[0];
            if (newest && newest.id !== lastId) {
              if (lastId === null) {
                lastId = newest.id;
                setLight(newest.decision);
                setCompact(true);
              } else {
                lastId = newest.id;
                pushItem({
                  decision: newest.decision,
                  needsReview: false,
                  hostname: newest.hostname || newest.url,
                  id: newest.id,
                });
              }
            }
          } catch {
            /* ignore */
          }
        }

        function openMain() {
          apiBridge()?.openMain?.();
        }
        document.getElementById("btn-open").onclick = openMain;
        document.getElementById("counts").onclick = openMain;
        host.onclick = () => {
          if (!bar.classList.contains("has-review")) openMain();
        };

        refresh();
        setInterval(refresh, 2000);

        if (new URLSearchParams(location.search).get("demo") === "1") {
          setInterval(() => {
            pushItem({
              decision: "review",
              needsReview: true,
              hostname: "unknown-partner.example",
              reviewId: "demo",
            });
          }, 8000);
        }
      })();
    </script>
  </body>
</html>
