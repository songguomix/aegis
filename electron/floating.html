<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Aegis Float</title>
    <style>
      :root {
        --text: #171717;
        --muted: #737373;
        --ok: #059669;
        --bad: #be123c;
        --warn: #a16207;
        --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
          "PingFang SC", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
      }
      body {
        background: transparent;
        overflow: hidden;
        user-select: none;
      }
      body.preview {
        background:
          radial-gradient(800px 400px at 50% 0%, rgba(99, 102, 241, 0.12), transparent 60%),
          #f3f4f6;
        min-height: 100vh;
        display: grid;
        place-items: start center;
        padding-top: 28px;
      }

      .bar {
        -webkit-app-region: drag;
        width: 100%;
        height: 100%;
        min-height: 52px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 8px 8px 12px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.95),
          0 10px 32px rgba(15, 23, 42, 0.14);
        backdrop-filter: blur(28px) saturate(170%);
        -webkit-backdrop-filter: blur(28px) saturate(170%);
        transition: padding 0.3s ease;
      }

      body.preview .bar {
        width: min(460px, 94vw);
        height: 56px;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.95),
          0 16px 40px rgba(15, 23, 42, 0.16);
      }

      .light {
        flex-shrink: 0;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #a3a3a3;
        box-shadow: 0 0 0 3px rgba(163, 163, 163, 0.16);
        transition:
          background 0.2s ease,
          box-shadow 0.2s ease,
          transform 0.2s ease;
      }
      .light.allow {
        background: var(--ok);
        box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.18);
      }
      .light.review {
        background: #d97706;
        box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.18);
      }
      .light.block {
        background: var(--bad);
        box-shadow: 0 0 0 3px rgba(190, 18, 60, 0.18);
      }
      .light.pulse {
        animation: pulse 0.55s ease;
      }
      @keyframes pulse {
        0% {
          transform: scale(0.85);
        }
        55% {
          transform: scale(1.22);
        }
        100% {
          transform: scale(1);
        }
      }

      .counts {
        -webkit-app-region: no-drag;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 3px;
        border-radius: 12px;
        background: rgba(17, 24, 39, 0.04);
        cursor: pointer;
      }
      .count {
        min-width: 40px;
        padding: 3px 7px;
        border-radius: 9px;
        text-align: center;
        transition: background 0.15s ease;
      }
      .count:hover {
        background: rgba(255, 255, 255, 0.85);
      }
      .count .n {
        display: block;
        font-size: 13.5px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }
      .count .l {
        display: block;
        font-size: 9px;
        font-weight: 650;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
        line-height: 1;
        margin-top: 1px;
      }
      .count.allow .n {
        color: var(--ok);
      }
      .count.review .n {
        color: var(--warn);
      }
      .count.block .n {
        color: var(--bad);
      }

      /*
        Domain strip: NOT a permanent right column.
        flex:0 → no empty space when idle.
        When .has-domain → flex:1 and fills ALL remaining width.
      */
      .domain {
        -webkit-app-region: no-drag;
        flex: 0 0 0%;
        min-width: 0;
        max-width: 0;
        opacity: 0;
        overflow: hidden;
        border-radius: 12px;
        background: rgba(17, 24, 39, 0.045);
        height: 36px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0;
        cursor: pointer;
        transition:
          flex 0.35s cubic-bezier(0.22, 1, 0.36, 1),
          max-width 0.35s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.28s ease,
          padding 0.28s ease,
          transform 0.28s ease;
        transform: translateX(12px);
      }
      .bar.has-domain .domain {
        flex: 1 1 auto;
        max-width: none;
        opacity: 1;
        padding: 0 12px;
        transform: translateX(0);
      }

      .domain .tag {
        flex-shrink: 0;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 2px 6px;
        border-radius: 5px;
        line-height: 1.2;
      }
      .tag.allow {
        color: var(--ok);
        background: rgba(5, 150, 105, 0.12);
      }
      .tag.review {
        color: var(--warn);
        background: rgba(217, 119, 6, 0.12);
      }
      .tag.block {
        color: var(--bad);
        background: rgba(190, 18, 60, 0.12);
      }
      .tag.ok {
        color: var(--muted);
        background: rgba(17, 24, 39, 0.06);
      }

      .domain .host {
        min-width: 0;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text);
        text-align: left;
      }

      .open {
        -webkit-app-region: no-drag;
        flex-shrink: 0;
        appearance: none;
        border: 1px solid rgba(17, 24, 39, 0.08);
        width: 28px;
        height: 28px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.72);
        color: #404040;
        cursor: pointer;
        display: grid;
        place-items: center;
        transition:
          background 0.15s ease,
          transform 0.15s ease;
        padding: 0;
      }
      .open:hover {
        background: #fff;
        transform: translateY(-1px);
      }
      .open svg {
        display: block;
      }

      .bar.flash-allow {
        animation: flashOk 0.45s ease;
      }
      .bar.flash-review {
        animation: flashWarn 0.45s ease;
      }
      .bar.flash-block {
        animation: flashBad 0.45s ease;
      }
      @keyframes flashOk {
        0% {
          box-shadow:
            inset 0 0 0 2px rgba(5, 150, 105, 0.45),
            0 10px 32px rgba(15, 23, 42, 0.14);
        }
        100% {
          box-shadow:
            inset 0 1px 0 rgba(255, 255, 255, 0.95),
            0 10px 32px rgba(15, 23, 42, 0.14);
        }
      }
      @keyframes flashWarn {
        0% {
          box-shadow:
            inset 0 0 0 2px rgba(217, 119, 6, 0.45),
            0 10px 32px rgba(15, 23, 42, 0.14);
        }
        100% {
          box-shadow:
            inset 0 1px 0 rgba(255, 255, 255, 0.95),
            0 10px 32px rgba(15, 23, 42, 0.14);
        }
      }
      @keyframes flashBad {
        0% {
          box-shadow:
            inset 0 0 0 2px rgba(190, 18, 60, 0.45),
            0 10px 32px rgba(15, 23, 42, 0.14);
        }
        100% {
          box-shadow:
            inset 0 1px 0 rgba(255, 255, 255, 0.95),
            0 10px 32px rgba(15, 23, 42, 0.14);
        }
      }
    </style>
  </head>
  <body>
    <div class="bar" id="bar">
      <div class="light" id="light" title="Latest decision"></div>
      <div class="counts" id="counts">
        <div class="count allow" title="Allowed">
          <span class="n" id="n-allow">0</span>
          <span class="l">OK</span>
        </div>
        <div class="count review" title="Pending">
          <span class="n" id="n-review">0</span>
          <span class="l">?</span>
        </div>
        <div class="count block" title="Blocked">
          <span class="n" id="n-block">0</span>
          <span class="l">NO</span>
        </div>
      </div>
      <div class="domain" id="domain" title="Open Aegis">
        <span class="tag" id="tag"></span>
        <span class="host" id="host"></span>
      </div>
      <button class="open" id="btn-open" title="Open Aegis" aria-label="Open">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path
            d="M4 10L10 4M10 4H5.5M10 4V8.5"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </div>

    <script>
      if (new URLSearchParams(location.search).get("preview") === "1") {
        document.body.classList.add("preview");
      }
      (function () {
        const LIVE_MS = 5000;
        const params = new URLSearchParams(location.search);
        const port = params.get("port") || "7832";
        const base = `http://127.0.0.1:${port}/api/v1`;

        const bar = document.getElementById("bar");
        const light = document.getElementById("light");
        const tag = document.getElementById("tag");
        const host = document.getElementById("host");
        const domainEl = document.getElementById("domain");

        let lastId = null;
        let hideTimer = null;
        let queue = [];
        let live = false;

        function setLight(decision) {
          light.className = "light " + (decision || "");
          void light.offsetWidth;
          light.classList.add("pulse");
        }

        function flash(decision) {
          const cls = "flash-" + decision;
          bar.classList.remove("flash-allow", "flash-review", "flash-block");
          void bar.offsetWidth;
          bar.classList.add(cls);
          setTimeout(() => bar.classList.remove(cls), 480);
        }

        /** Expand domain to fill ALL remaining bar width. */
        function showDomain(decision, hostname) {
          live = true;
          setLight(decision);
          tag.className = "tag " + decision;
          tag.textContent = decision;
          host.textContent = hostname || "";
          // force reflow then expand — no reserved empty right side
          bar.classList.remove("has-domain");
          void domainEl.offsetWidth;
          bar.classList.add("has-domain");
          flash(decision);
          clearTimeout(hideTimer);
          hideTimer = setTimeout(() => {
            live = false;
            bar.classList.remove("has-domain");
            const next = queue.shift();
            if (next) {
              setTimeout(() => showDomain(next.decision, next.hostname), 220);
            }
          }, LIVE_MS);
        }

        function pushDomain(decision, hostname) {
          if (live) {
            queue = queue.filter((q) => q.hostname !== hostname);
            queue.unshift({ decision, hostname });
            if (queue.length > 4) queue.length = 4;
            // update light immediately, domain replaces when current ends
            setLight(decision);
            return;
          }
          showDomain(decision, hostname);
        }

        async function refresh() {
          try {
            const [healthRes, histRes] = await Promise.all([
              fetch(base + "/health"),
              fetch(base + "/history?limit=5"),
            ]);
            const health = await healthRes.json();
            const hist = await histRes.json();
            document.getElementById("n-allow").textContent = String(
              health?.stats?.allow ?? 0,
            );
            document.getElementById("n-review").textContent = String(
              health?.reviews?.pending ?? health?.stats?.review ?? 0,
            );
            document.getElementById("n-block").textContent = String(
              health?.stats?.block ?? 0,
            );

            const items = hist?.items ?? [];
            const newest = items[0];
            if (newest && newest.id !== lastId) {
              if (lastId === null) {
                // boot: light only — do NOT leave an empty domain slot
                lastId = newest.id;
                setLight(newest.decision);
              } else {
                lastId = newest.id;
                pushDomain(newest.decision, newest.hostname || newest.url);
              }
            }
          } catch {
            /* ignore */
          }
        }

        function openMain() {
          if (window.aegisFloating && window.aegisFloating.openMain) {
            window.aegisFloating.openMain();
          }
        }
        document.getElementById("btn-open").onclick = openMain;
        document.getElementById("counts").onclick = openMain;
        domainEl.onclick = openMain;

        refresh();
        setInterval(refresh, 2000);

        if (new URLSearchParams(location.search).get("demo") === "1") {
          const demo = [
            ["allow", "github.com"],
            ["review", "unknown-partner.example"],
            ["block", "guthub.com"],
            ["allow", "raw.githubusercontent.com"],
          ];
          let i = 0;
          setInterval(() => {
            const d = demo[i % demo.length];
            i++;
            pushDomain(d[0], d[1]);
          }, 3500);
        }
      })();
    </script>
  </body>
</html>
