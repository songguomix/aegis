<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Aegis Float</title>
    <style>
      :root {
        --text: #171717;
        --muted: #737373;
        --ok: #059669;
        --bad: #be123c;
        --warn: #a16207;
        --spring: cubic-bezier(0.22, 1.15, 0.36, 1);
        --soft: cubic-bezier(0.4, 0, 0.2, 1);
        --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
          "PingFang SC", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
      }
      body {
        background: transparent;
        overflow: hidden;
        user-select: none;
      }
      body.preview {
        background:
          radial-gradient(800px 400px at 50% 0%, rgba(99, 102, 241, 0.12), transparent 60%),
          #f3f4f6;
        min-height: 100vh;
        display: grid;
        place-items: start center;
        padding-top: 28px;
      }

      .bar {
        -webkit-app-region: drag;
        width: 100%;
        height: 100%;
        min-height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 8px 8px 8px 12px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.95),
          0 10px 32px rgba(15, 23, 42, 0.14);
        backdrop-filter: blur(28px) saturate(170%);
        -webkit-backdrop-filter: blur(28px) saturate(170%);
        transition:
          box-shadow 0.45s var(--soft),
          transform 0.45s var(--spring);
        will-change: box-shadow;
      }
      .bar.has-domain {
        justify-content: flex-start;
      }
      .bar.lift {
        transform: scale(1.015);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.98),
          0 14px 40px rgba(15, 23, 42, 0.18);
      }

      body.preview .bar {
        width: min(460px, 94vw);
        height: 56px;
        transition: width 0.45s var(--spring), box-shadow 0.45s var(--soft);
      }
      body.preview .bar:not(.has-domain) {
        width: min(240px, 88vw);
        margin: 0 auto;
      }

      .light {
        position: relative;
        flex-shrink: 0;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #a3a3a3;
        box-shadow: 0 0 0 3px rgba(163, 163, 163, 0.16);
        transition:
          background 0.35s var(--soft),
          box-shadow 0.45s var(--soft),
          transform 0.4s var(--spring);
      }
      .light::after {
        content: "";
        position: absolute;
        inset: -3px;
        border-radius: 50%;
        border: 1.5px solid transparent;
        opacity: 0;
      }
      .light.allow {
        background: var(--ok);
        box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.18);
      }
      .light.review {
        background: #d97706;
        box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.18);
      }
      .light.block {
        background: var(--bad);
        box-shadow: 0 0 0 3px rgba(190, 18, 60, 0.18);
      }
      .light.allow::after {
        border-color: rgba(5, 150, 105, 0.45);
      }
      .light.review::after {
        border-color: rgba(217, 119, 6, 0.45);
      }
      .light.block::after {
        border-color: rgba(190, 18, 60, 0.45);
      }
      .light.pulse {
        animation: lightPulse 0.75s var(--spring);
      }
      .light.pulse::after {
        animation: ringOut 0.75s var(--soft);
      }
      @keyframes lightPulse {
        0% {
          transform: scale(0.75);
        }
        40% {
          transform: scale(1.28);
        }
        70% {
          transform: scale(0.94);
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes ringOut {
        0% {
          opacity: 0.9;
          transform: scale(0.7);
        }
        100% {
          opacity: 0;
          transform: scale(2.1);
        }
      }

      .counts {
        -webkit-app-region: no-drag;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 3px;
        border-radius: 12px;
        background: rgba(17, 24, 39, 0.04);
        cursor: pointer;
        transition: background 0.25s var(--soft);
      }
      .counts:hover {
        background: rgba(17, 24, 39, 0.06);
      }
      .count {
        min-width: 40px;
        padding: 3px 7px;
        border-radius: 9px;
        text-align: center;
        transition:
          background 0.2s var(--soft),
          transform 0.35s var(--spring);
      }
      .count:hover {
        background: rgba(255, 255, 255, 0.9);
      }
      .count.bump .n {
        animation: numBump 0.45s var(--spring);
      }
      @keyframes numBump {
        0% {
          transform: translateY(2px) scale(0.92);
          opacity: 0.7;
        }
        55% {
          transform: translateY(-1px) scale(1.06);
        }
        100% {
          transform: translateY(0) scale(1);
          opacity: 1;
        }
      }
      .count .n {
        display: block;
        font-size: 13.5px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }
      .count .l {
        display: block;
        font-size: 9px;
        font-weight: 650;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
        line-height: 1;
        margin-top: 1px;
      }
      .count.allow .n {
        color: var(--ok);
      }
      .count.review .n {
        color: var(--warn);
      }
      .count.block .n {
        color: var(--bad);
      }

      .domain {
        -webkit-app-region: no-drag;
        flex: 0 0 0%;
        min-width: 0;
        max-width: 0;
        opacity: 0;
        overflow: hidden;
        border-radius: 12px;
        background: linear-gradient(
          90deg,
          rgba(17, 24, 39, 0.05),
          rgba(17, 24, 39, 0.03)
        );
        height: 36px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0;
        cursor: pointer;
        transform: translateX(16px) scaleX(0.92);
        transform-origin: left center;
        transition:
          flex 0.42s var(--spring),
          max-width 0.42s var(--spring),
          opacity 0.28s var(--soft) 0.05s,
          padding 0.32s var(--soft),
          transform 0.42s var(--spring),
          background 0.35s var(--soft);
        will-change: flex, max-width, opacity, transform;
      }
      .bar.has-domain .domain {
        flex: 1 1 auto;
        max-width: none;
        opacity: 1;
        padding: 0 12px;
        transform: translateX(0) scaleX(1);
      }

      .domain .tag {
        flex-shrink: 0;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 2px 6px;
        border-radius: 5px;
        line-height: 1.2;
        opacity: 0;
        transform: translateY(4px);
        transition:
          opacity 0.3s var(--soft) 0.12s,
          transform 0.35s var(--spring) 0.1s;
      }
      .bar.has-domain .domain .tag {
        opacity: 1;
        transform: translateY(0);
      }
      .tag.allow {
        color: var(--ok);
        background: rgba(5, 150, 105, 0.12);
      }
      .tag.review {
        color: var(--warn);
        background: rgba(217, 119, 6, 0.12);
      }
      .tag.block {
        color: var(--bad);
        background: rgba(190, 18, 60, 0.12);
      }

      .domain .host {
        min-width: 0;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text);
        text-align: left;
        opacity: 0;
        transform: translateY(5px);
        transition:
          opacity 0.32s var(--soft) 0.16s,
          transform 0.38s var(--spring) 0.14s;
      }
      .bar.has-domain .domain .host {
        opacity: 1;
        transform: translateY(0);
      }

      .open {
        -webkit-app-region: no-drag;
        flex-shrink: 0;
        margin-left: auto;
        appearance: none;
        border: 1px solid rgba(17, 24, 39, 0.08);
        width: 28px;
        height: 28px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.72);
        color: #404040;
        cursor: pointer;
        display: grid;
        place-items: center;
        padding: 0;
        transition:
          background 0.2s var(--soft),
          transform 0.35s var(--spring),
          box-shadow 0.25s var(--soft);
      }
      .bar:not(.has-domain) .open {
        margin-left: 0;
      }
      .open:hover {
        background: #fff;
        transform: translateY(-1px) scale(1.04);
        box-shadow: 0 4px 12px rgba(15, 23, 42, 0.1);
      }
      .open:hover svg {
        transform: translate(1px, -1px);
      }
      .open:active {
        transform: translateY(0) scale(0.96);
      }
      .open svg {
        display: block;
        transition: transform 0.25s var(--spring);
      }

      .bar.flash-allow,
      .bar.flash-review,
      .bar.flash-block {
        animation: borderGlow 0.7s var(--soft);
      }
      @keyframes borderGlow {
        0% {
          box-shadow:
            inset 0 0 0 2px rgba(5, 150, 105, 0),
            0 10px 32px rgba(15, 23, 42, 0.14);
        }
        25% {
          box-shadow:
            inset 0 0 0 2px rgba(5, 150, 105, 0.4),
            0 14px 36px rgba(15, 23, 42, 0.16);
        }
        100% {
          box-shadow:
            inset 0 0 0 2px rgba(5, 150, 105, 0),
            0 10px 32px rgba(15, 23, 42, 0.14);
        }
      }
      .bar.flash-review {
        animation-name: borderGlowWarn;
      }
      .bar.flash-block {
        animation-name: borderGlowBad;
      }
      @keyframes borderGlowWarn {
        0% {
          box-shadow:
            inset 0 0 0 2px rgba(217, 119, 6, 0),
            0 10px 32px rgba(15, 23, 42, 0.14);
        }
        25% {
          box-shadow:
            inset 0 0 0 2px rgba(217, 119, 6, 0.42),
            0 14px 36px rgba(15, 23, 42, 0.16);
        }
        100% {
          box-shadow:
            inset 0 0 0 2px rgba(217, 119, 6, 0),
            0 10px 32px rgba(15, 23, 42, 0.14);
        }
      }
      @keyframes borderGlowBad {
        0% {
          box-shadow:
            inset 0 0 0 2px rgba(190, 18, 60, 0),
            0 10px 32px rgba(15, 23, 42, 0.14);
        }
        25% {
          box-shadow:
            inset 0 0 0 2px rgba(190, 18, 60, 0.42),
            0 14px 36px rgba(15, 23, 42, 0.16);
        }
        100% {
          box-shadow:
            inset 0 0 0 2px rgba(190, 18, 60, 0),
            0 10px 32px rgba(15, 23, 42, 0.14);
        }
      }
    </style>
  </head>
  <body>
    <div class="bar" id="bar">
      <div class="light" id="light" title="Latest decision"></div>
      <div class="counts" id="counts">
        <div class="count allow" data-k="allow" title="Allowed">
          <span class="n" id="n-allow">0</span>
          <span class="l">OK</span>
        </div>
        <div class="count review" data-k="review" title="Pending">
          <span class="n" id="n-review">0</span>
          <span class="l">?</span>
        </div>
        <div class="count block" data-k="block" title="Blocked">
          <span class="n" id="n-block">0</span>
          <span class="l">NO</span>
        </div>
      </div>
      <div class="domain" id="domain" title="Open Aegis">
        <span class="tag" id="tag"></span>
        <span class="host" id="host"></span>
      </div>
      <button class="open" id="btn-open" title="Open Aegis" aria-label="Open">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path
            d="M4 10L10 4M10 4H5.5M10 4V8.5"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </div>

    <script>
      if (new URLSearchParams(location.search).get("preview") === "1") {
        document.body.classList.add("preview");
      }
      (function () {
        const LIVE_MS = 5000;
        const params = new URLSearchParams(location.search);
        const port = params.get("port") || "7832";
        const base = `http://127.0.0.1:${port}/api/v1`;

        const bar = document.getElementById("bar");
        const light = document.getElementById("light");
        const tag = document.getElementById("tag");
        const host = document.getElementById("host");
        const domainEl = document.getElementById("domain");

        let lastId = null;
        let hideTimer = null;
        let queue = [];
        let live = false;
        const lastCounts = { allow: null, review: null, block: null };

        function setCompact(compact) {
          try {
            if (window.aegisFloating && window.aegisFloating.setCompact) {
              window.aegisFloating.setCompact(compact);
            }
          } catch {
            /* preview */
          }
        }

        function setLight(decision) {
          light.classList.remove("pulse");
          light.className = "light " + (decision || "");
          void light.offsetWidth;
          light.classList.add("pulse");
        }

        function flash(decision) {
          const cls = "flash-" + decision;
          bar.classList.remove("flash-allow", "flash-review", "flash-block", "lift");
          void bar.offsetWidth;
          bar.classList.add(cls, "lift");
          setTimeout(() => {
            bar.classList.remove(cls, "lift");
          }, 700);
        }

        function bumpCount(key, value) {
          const el = document.querySelector('.count[data-k="' + key + '"] .n');
          const wrap = document.querySelector('.count[data-k="' + key + '"]');
          if (!el) return;
          const changed = lastCounts[key] !== value;
          lastCounts[key] = value;
          el.textContent = String(value);
          if (!changed) return;
          wrap.classList.remove("bump");
          void wrap.offsetWidth;
          wrap.classList.add("bump");
        }

        function showDomain(decision, hostname) {
          live = true;
          setLight(decision);
          tag.className = "tag " + decision;
          tag.textContent = decision;
          host.textContent = hostname || "";
          bar.classList.remove("has-domain");
          void domainEl.offsetWidth;
          // expand: spring width + delayed text fade-in (CSS)
          requestAnimationFrame(() => {
            bar.classList.add("has-domain");
            setCompact(false);
          });
          flash(decision);
          clearTimeout(hideTimer);
          hideTimer = setTimeout(() => {
            live = false;
            bar.classList.remove("has-domain");
            setCompact(true);
            const next = queue.shift();
            if (next) {
              setTimeout(() => showDomain(next.decision, next.hostname), 280);
            }
          }, LIVE_MS);
        }

        function pushDomain(decision, hostname) {
          if (live) {
            queue = queue.filter((q) => q.hostname !== hostname);
            queue.unshift({ decision, hostname });
            if (queue.length > 4) queue.length = 4;
            setLight(decision);
            return;
          }
          showDomain(decision, hostname);
        }

        async function refresh() {
          try {
            const [healthRes, histRes] = await Promise.all([
              fetch(base + "/health"),
              fetch(base + "/history?limit=5"),
            ]);
            const health = await healthRes.json();
            const hist = await histRes.json();
            bumpCount("allow", health?.stats?.allow ?? 0);
            bumpCount(
              "review",
              health?.reviews?.pending ?? health?.stats?.review ?? 0,
            );
            bumpCount("block", health?.stats?.block ?? 0);

            const items = hist?.items ?? [];
            const newest = items[0];
            if (newest && newest.id !== lastId) {
              if (lastId === null) {
                lastId = newest.id;
                setLight(newest.decision);
                setCompact(true);
              } else {
                lastId = newest.id;
                pushDomain(newest.decision, newest.hostname || newest.url);
              }
            }
          } catch {
            /* ignore */
          }
        }

        function openMain() {
          if (window.aegisFloating && window.aegisFloating.openMain) {
            window.aegisFloating.openMain();
          }
        }
        document.getElementById("btn-open").onclick = openMain;
        document.getElementById("counts").onclick = openMain;
        domainEl.onclick = openMain;

        refresh();
        setInterval(refresh, 2000);

        if (new URLSearchParams(location.search).get("demo") === "1") {
          const demo = [
            ["allow", "github.com"],
            ["review", "unknown-partner.example"],
            ["block", "guthub.com"],
            ["allow", "raw.githubusercontent.com"],
          ];
          let i = 0;
          setInterval(() => {
            const d = demo[i % demo.length];
            i++;
            pushDomain(d[0], d[1]);
          }, 3800);
        }
      })();
    </script>
  </body>
</html>
