<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Aegis Float</title>
    <style>
      :root {
        --text: #171717;
        --muted: #737373;
        --ok: #059669;
        --bad: #be123c;
        --warn: #a16207;
        --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
          "PingFang SC", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
      }
      body {
        background: transparent;
        overflow: hidden;
        user-select: none;
      }
      /* Preview shell only (browser demo) */
      body.preview {
        background:
          radial-gradient(800px 400px at 50% 0%, rgba(99, 102, 241, 0.12), transparent 60%),
          #f3f4f6;
        min-height: 100vh;
        display: grid;
        place-items: start center;
        padding-top: 28px;
        user-select: none;
      }

      .bar {
        -webkit-app-region: drag;
        width: 100%;
        height: 100%;
        min-height: 52px;
        display: grid;
        grid-template-columns: 14px auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        padding: 8px 10px 8px 12px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.95),
          0 10px 32px rgba(15, 23, 42, 0.14);
        backdrop-filter: blur(28px) saturate(170%);
        -webkit-backdrop-filter: blur(28px) saturate(170%);
      }

      body.preview .bar {
        width: min(420px, 92vw);
        height: 56px;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.95),
          0 16px 40px rgba(15, 23, 42, 0.16);
      }

      /* Left status light */
      .light {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #a3a3a3;
        box-shadow: 0 0 0 3px rgba(163, 163, 163, 0.16);
        flex-shrink: 0;
      }
      .light.allow {
        background: var(--ok);
        box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.18);
      }
      .light.review {
        background: #d97706;
        box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.18);
      }
      .light.block {
        background: var(--bad);
        box-shadow: 0 0 0 3px rgba(190, 18, 60, 0.18);
      }
      .light.pulse {
        animation: pulse 0.9s ease;
      }
      @keyframes pulse {
        0% { transform: scale(0.85); }
        55% { transform: scale(1.2); }
        100% { transform: scale(1); }
      }

      /* Right: last site */
      .msg {
        min-width: 0;
        -webkit-app-region: no-drag;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        justify-content: center;
        gap: 1px;
        height: 100%;
        text-align: right;
      }
      .msg .line1 {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
        min-width: 0;
        max-width: 100%;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text);
        line-height: 1.2;
      }
      .msg .verdict {
        flex-shrink: 0;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 1px 6px;
        border-radius: 5px;
      }
      .verdict.allow {
        color: var(--ok);
        background: rgba(5, 150, 105, 0.12);
      }
      .verdict.review {
        color: var(--warn);
        background: rgba(217, 119, 6, 0.12);
      }
      .verdict.block {
        color: var(--bad);
        background: rgba(190, 18, 60, 0.12);
      }
      .msg .host {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        font-weight: 500;
        color: var(--text);
      }
      .msg .sub {
        font-size: 10.5px;
        color: var(--muted);
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
      }

      /* Counts */
      .counts {
        -webkit-app-region: no-drag;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 3px;
        border-radius: 12px;
        background: rgba(17, 24, 39, 0.04);
      }
      .count {
        min-width: 44px;
        padding: 3px 8px;
        border-radius: 9px;
        text-align: center;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .count:hover {
        background: rgba(255, 255, 255, 0.85);
      }
      .count .n {
        display: block;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }
      .count .l {
        display: block;
        font-size: 9px;
        font-weight: 650;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
        line-height: 1;
        margin-top: 1px;
      }
      .count.allow .n { color: var(--ok); }
      .count.review .n { color: var(--warn); }
      .count.block .n { color: var(--bad); }

      /* Open button — clean chevron in a soft square */
      .open {
        -webkit-app-region: no-drag;
        appearance: none;
        border: 1px solid rgba(17, 24, 39, 0.08);
        width: 30px;
        height: 30px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.7);
        color: #404040;
        cursor: pointer;
        display: grid;
        place-items: center;
        transition: background 0.15s ease, transform 0.15s ease;
        padding: 0;
      }
      .open:hover {
        background: #fff;
        transform: translateY(-1px);
      }
      .open:active {
        transform: translateY(0);
      }
      .open svg {
        display: block;
      }

      /* Flash strip when new decision arrives */
      .bar.flash-allow { animation: flashOk 0.7s ease; }
      .bar.flash-review { animation: flashWarn 0.7s ease; }
      .bar.flash-block { animation: flashBad 0.7s ease; }
      @keyframes flashOk {
        0% { box-shadow: inset 0 0 0 2px rgba(5, 150, 105, 0.55), 0 10px 32px rgba(15, 23, 42, 0.14); }
        100% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95), 0 10px 32px rgba(15, 23, 42, 0.14); }
      }
      @keyframes flashWarn {
        0% { box-shadow: inset 0 0 0 2px rgba(217, 119, 6, 0.55), 0 10px 32px rgba(15, 23, 42, 0.14); }
        100% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95), 0 10px 32px rgba(15, 23, 42, 0.14); }
      }
      @keyframes flashBad {
        0% { box-shadow: inset 0 0 0 2px rgba(190, 18, 60, 0.55), 0 10px 32px rgba(15, 23, 42, 0.14); }
        100% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95), 0 10px 32px rgba(15, 23, 42, 0.14); }
      }
    </style>
  </head>
  <body>
    <div class="bar" id="bar">
      <div class="light" id="light" title="Last decision"></div>
      <div class="counts" id="counts">
        <div class="count allow" title="Allowed">
          <span class="n" id="n-allow">0</span>
          <span class="l">OK</span>
        </div>
        <div class="count review" title="Pending review">
          <span class="n" id="n-review">0</span>
          <span class="l">?</span>
        </div>
        <div class="count block" title="Blocked">
          <span class="n" id="n-block">0</span>
          <span class="l">NO</span>
        </div>
      </div>
      <div class="msg">
        <div class="line1">
          <span class="verdict" id="verdict" hidden></span>
          <span class="host" id="host">Aegis</span>
        </div>
        <div class="sub" id="sub">Monitoring · drag to move</div>
      </div>
      <button class="open" id="btn-open" title="Open Aegis" aria-label="Open">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M4 10L10 4M10 4H5.5M10 4V8.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <script>
      if (new URLSearchParams(location.search).get("preview") === "1") {
        document.body.classList.add("preview");
      }
      (function () {
        const isElectron = !document.body.classList.contains("preview");
        const params = new URLSearchParams(location.search);
        const port =
          params.get("port") ||
          (window.aegisFloat && window.aegisFloat.port) ||
          "7832";
        const base = `http://127.0.0.1:${port}/api/v1`;

        const light = document.getElementById("light");
        const verdict = document.getElementById("verdict");
        const hostEl = document.getElementById("host");
        const subEl = document.getElementById("sub");
        const bar = document.getElementById("bar");
        let lastId = null;
        let flashTimer = null;

        function setDecision(decision, hostname, note) {
          light.className = "light " + (decision || "");
          // retrigger pulse
          void light.offsetWidth;
          light.classList.add("pulse");
          verdict.hidden = !decision;
          if (decision) {
            verdict.className = "verdict " + decision;
            verdict.textContent = decision;
          }
          hostEl.textContent = hostname || "Aegis";
          subEl.textContent = note || "Monitoring · drag to move";
          bar.classList.remove("flash-allow", "flash-review", "flash-block");
          void bar.offsetWidth;
          bar.classList.add("flash-" + decision);
          clearTimeout(flashTimer);
          flashTimer = setTimeout(() => {
            bar.classList.remove("flash-allow", "flash-review", "flash-block");
          }, 700);
        }

        async function refresh() {
          try {
            const [healthRes, histRes] = await Promise.all([
              fetch(base + "/health"),
              fetch(base + "/history?limit=1"),
            ]);
            const health = await healthRes.json();
            const hist = await histRes.json();
            document.getElementById("n-allow").textContent =
              String(health?.stats?.allow ?? 0);
            document.getElementById("n-review").textContent =
              String(health?.reviews?.pending ?? health?.stats?.review ?? 0);
            document.getElementById("n-block").textContent =
              String(health?.stats?.block ?? 0);

            const item = hist?.items?.[0];
            if (item && item.id !== lastId) {
              lastId = item.id;
              const label =
                item.decision === "allow"
                  ? "passed"
                  : item.decision === "block"
                    ? "blocked"
                    : "needs review";
              setDecision(
                item.decision,
                item.hostname || item.url,
                label + " · " + new Date(item.checkedAt).toLocaleTimeString(),
              );
            } else if (!item && lastId === null) {
              hostEl.textContent = "Aegis";
              subEl.textContent =
                "Monitoring · " +
                (health?.ok ? "connected" : "connecting") +
                " · drag to move";
            }
          } catch {
            subEl.textContent = "Connecting…";
          }
        }

        function openMain() {
          if (window.aegisFloating && window.aegisFloating.openMain) {
            window.aegisFloating.openMain();
          }
        }

        document.getElementById("btn-open").onclick = openMain;
        document.getElementById("counts").onclick = openMain;
        document.querySelector(".msg").onclick = openMain;

        refresh();
        setInterval(refresh, 2000);
      })();
    </script>
  </body>
</html>
